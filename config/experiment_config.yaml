providers:
  matlab:
    enabled: true
    preprocessing:
      runtime_path: matlab_runtime/pystar_preprocessing
      entrypoint: pystar_preprocess_entry
      loader_input_format: uint8
      loader_output_dtype: uint8
      use_gpu: false
      morphology:
        method: 2d
        radius: 5
        height: 3
    registration:
      runtime_path: matlab_runtime/pystar_registration
      entrypoint: pystar_register_global_entry
      local_entrypoints:
        demons_3d: pystar_register_local_demons_entry
      volume_transfer_mode: temporary_tiff
      input_volume_dtype: uint8
      use_gpu: false
    spot_finding:
      runtime_path: matlab_runtime/pystar_spotfinding
      entrypoint: pystar_spotfind_entry
      volume_transfer_mode: temporary_tiff
      input_volume_dtype: uint8
    extraction:
      runtime_path: matlab_runtime/pystar_extraction
      entrypoint: pystar_extract_entry
      volume_transfer_mode: temporary_tiff
      coords_transfer_mode: temporary_csv
      input_volume_dtype: float32
pipeline:
  scope_mode: full_fov
  accelerator: cpu
  field_semantics:
    representation: residual
    composition: sequential_global_then_local
    status: provisional
  preprocessing:
    enable: true
    sequence:
    - method: none
      provider: native
      params: {}
    - method: min_max_normalize
      provider: native
      params: {}
    - method: histogram_match
      provider: native
      params:
        scope: inter_round
    - method: histogram_match
      provider: native
      params:
        scope: intra_round
    - method: morpho_reconstruction_contrast
      provider: native
      params:
        radius: 5
        downsample_factor: 0.25
  registration:
    reference_round: 1
    source:
      method: mip_all_channels
      mip_channels:
      - 0
      - 1
      - 2
    global:
      enabled: true
      method: phase_corr_3d
      provider: native
      params:
        downsample_factor: 1
        use_gpu: false
        max_shift: 200
    local:
      enabled: true
      method: demons_3d
      provider: native
      params:
        bspline:
          grid_spacing: 17
          num_iter: 70
        optical_flow:
          coarse_scale: 0.12
          blur_sigma: 1.9
          attachment: 2.0
          tightness: 0.45
          num_warp: 5
          num_iter: 10
          tol: 0.0001
        demons_3d:
          num_iter: 50
          smoothing_sigma: 1.0
    guards:
      skip_if_global_corr_below: 0.2
      reject_if_correlation_worse: true
    save_displacement_fields: true
    save_registered_images: false
  spot_finding:
    algorithm: peak_local_max
    provider: native
    reference_round: 1
    method: max_intensity
    spotiflow:
      model_name: smfish_3d
      prob_thresh: 0.5
      use_gpu: true
    blob_dog:
      min_sigma:
      - 0.5
      - 1.0
      - 1.0
      max_sigma:
      - 2.0
      - 5.0
      - 5.0
      threshold: 0.01
      overlap: 0.5
    peak_local_max:
      min_distance: 2
      threshold_rel: 0.05
      exclude_border: true
  extraction:
    method: box_sum
    provider: native
    integration_box:
    - 3
    - 3
    - 3
    handle_out_of_bounds: pad_zero
    transform_application_mode: image_warp
  output:
    directory: /gpfs/share/home/2201112433/labShare/2501111695/data/202512_mouse_testis_r1_leica/02_pystar_output
    save_qc_images: true
  qc:
    enable: true
    alignment_check:
      roi_size: 512
      num_samples: 3
      blend_colors:
      - green
      - magenta
    correlation_plot:
      dpi: 150
      show_threshold: true
